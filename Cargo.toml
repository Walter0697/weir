[package]
name = "weir"
version = "0.1.0"
edition = "2021"
description = "Keeps a fork in step with its upstream and puts the result behind a pull request"
license = "MIT"
repository = "https://github.com/walter0697/weir"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
