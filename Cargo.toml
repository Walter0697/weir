[package]
name = "weir"
version = "0.1.0"
edition = "2021"
description = "Keeps a fork in step with its upstream and puts the result behind a pull request"
license = "MIT"
repository = "https://github.com/walter0697/weir"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
