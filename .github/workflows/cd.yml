name: CD

on:
  # Every commit on main publishes `edge`, so there is always a pullable image
  # without anyone cutting a tag by hand. Version tags come later.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Nothing is published unless the same checks that guard main have passed on
  # this exact commit.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/weir
          # `latest` is deliberately reserved for tagged releases. A main build
          # is `edge`, plus its commit, so anyone pinning to a known-good build
          # can, and nobody gets an untagged commit under `latest` by surprise.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only for now. arm64 is worth adding when something needs it,
          # but it wants a native arm64 runner in a matrix — building Rust under
          # QEMU emulation turns a three-minute release into forty.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
