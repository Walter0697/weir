name: CI

on:
  pull_request:
  # Main is covered by CD, which calls this before publishing anything. Keeping
  # the push trigger here as well would run every check twice per commit.
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests build real git repositories in temporary directories, so git
      # has to be present and needs no identity of its own — one is passed on
      # every invocation.
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Built but not pushed: this only proves the Dockerfile still works, so a
      # broken one is caught on the pull request rather than at release time.
      - run: docker build -t weir:ci .
      - run: docker run --rm weir:ci --version
