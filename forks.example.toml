# Example fork list. Copy it, point it at your own forge, and keep it wherever
# your deployment lives — this file holds no secrets, only the names of the
# environment variables that carry them.

version = 1

[forge]
kind  = "gitea"          # or "forgejo" — same API
url   = "https://gitea.example.com"
owner = "my-org"
# token_env = "WEIR_TOKEN"   # a machine account's token, write:repository scope

[defaults]
# sync_branch   = "upstream-sync"
# boundary_file = ".upstream-sync"

[[fork]]
repo     = "codex"
upstream = "https://github.com/openai/codex.git"
branch   = "main"
# Paths this fork deleted on purpose that upstream keeps editing. Git raises
# the same delete/modify conflict every sync and the answer never changes, so
# it is declared once here and enforced after every merge — which also stops
# upstream quietly re-adding one of them in a later commit.
#
# This is NOT "resolve conflicts by deleting". Any conflict without a rule here
# is left for a human — the pull request is marked unmergeable on purpose.
# Exact paths only, no globs: this fork keeps its own workflow in the same
# directory as the upstream ones it dropped.
keep_removed = [
  ".github/workflows/rust-release.yml",
]

[[fork]]
repo     = "dokploy"
upstream = "https://github.com/Dokploy/dokploy.git"
branch   = "canary"          # forks need not agree about their base branch

