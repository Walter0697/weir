# weir performs one sync pass and exits, so this is not a service that stays up.
# Bring it up with `docker compose run`, and let something outside decide when:
#
#   docker compose run --rm weir run --dry-run     # look first
#   docker compose run --rm weir run               # do it
#   docker compose run --rm weir run --repo codex  # one fork
#
# To schedule it, point a cron or systemd timer at the same command:
#
#   0 5 * * 5  cd /srv/weir && docker compose run --rm weir run >> /var/log/weir.log 2>&1

services:
  # The web UI and its scheduler: long-running, unlike the one-shot service
  # below. The two are alternatives rather than a pair — pick one.
  #
  #   docker compose up -d ui
  #
  # Published to loopback on the host, because anything that reaches this can
  # change which repositories get force-pushed. Front it with your reverse
  # proxy if you want it elsewhere.
  ui:
    image: ghcr.io/walter0697/weir:edge
    restart: unless-stopped
    command: ["serve", "--db", "/data/weir.db", "--bind", "0.0.0.0:8080"]

    # Two different tokens, easily confused:
    #
    #   WEIR_UI_TOKEN   lets *you* into this web page. Invent one.
    #   the forge PAT   lets weir push and open pull requests. Set it in the
    #                   UI under Connections; it lives in the database, not here.
    #
    # WEIR_UI_TOKEN is only required when this is reachable from more than
    # localhost. Unset, the page is open to anything that can reach the port.
    environment:
      - WEIR_UI_TOKEN=${WEIR_UI_TOKEN:?set one, e.g. head -c 18 /dev/urandom | base64}

    ports:
      # Published to localhost only. To reach it from another machine, drop the
      # 127.0.0.1: prefix — and note the sign-in token then crosses the network
      # in the clear, since this is plain HTTP.
      - "127.0.0.1:8080:8080"

    volumes:
      # A *named* volume on purpose. Docker gives it the image user's
      # ownership, so the unprivileged user inside can write to it.
      #
      # Bind mount a host directory here instead and it keeps the host's
      # ownership, which that user cannot write — the container then exits
      # immediately with "unable to open database file". If you want a bind
      # mount, add `user: "1000:1000"` (matching `id -u`) and `HOME=/tmp`.
      #
      # Holds the forge token. Treat this volume as a secret.
      - weir-data:/data

  # One sync pass, then exit. Configuration comes from forks.toml rather than
  # from the UI's database; the two are never merged.
  weir:
    image: ghcr.io/walter0697/weir:edge
    # `edge` follows main. Pin a digest or a version tag for anything you would
    # be annoyed to see change under you.

    # Secrets, and only secrets. Everything else lives in forks.toml.
    #   WEIR_TOKEN=...            forge machine account, write:repository
    #   TELEGRAM_BOT_TOKEN=...    optional, only if [[notify]] is configured
    #   TELEGRAM_CHAT_ID=...      optional, likewise
    env_file:
      - weir.env

    volumes:
      # The container runs as uid 10001, so this file has to be readable by
      # others. It holds no secrets, which is what makes that safe.
      - ./forks.toml:/etc/weir/forks.toml:ro

    # The image already defaults to this; stated here so it is obvious what
    # `docker compose run --rm weir` does with no arguments.
    command: ["run", "--config", "/etc/weir/forks.toml"]

    # A sync clones an upstream repository and runs git over it. Nothing here
    # needs to write outside its own workspace or gain privileges.
    read_only: false
    security_opt:
      - no-new-privileges:true

volumes:
  weir-data:
